<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Grabber Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="wrap">
        <h1>5etools Monster Grabber</h1>
        <p class="sub">Configure extension behavior.</p>

        <label class="row" for="auto-close-source-modal">
            <input id="auto-close-source-modal" type="checkbox">
            <span>Auto-close 5etools source modal after copy</span>
        </label>

        <div class="actions">
            <button id="save" type="button">Save</button>
            <span id="status" aria-live="polite"></span>
        </div>
    </main>

    <script type="module" src="src/options/main.js"></script>
</body>
</html>
